name: Deploy to VDS

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.prep.outputs.image_ref }}
      image_base: ${{ steps.prep.outputs.image_base }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase image reference
        id: prep
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_base=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_LOWER}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prep.outputs.image_base }}:latest
            ${{ steps.prep.outputs.image_base }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: VDS deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Создаём общую Docker-сеть и подключаем контейнер ai-gateway
            docker network create typst-net 2>/dev/null || true
            docker network connect typst-net ai-gateway 2>/dev/null || true

            docker stop typst-gost typst-gost-2 || true
            docker rm typst-gost typst-gost-2 || true

            docker pull ${{ needs.build.outputs.image_ref }}

            # Первый контейнер (порт 3000)
            docker run -d \
              --restart always \
              --name typst-gost \
              --network typst-net \
              --add-host=host.docker.internal:host-gateway \
              -p 3000:3000 \
              -e FEEDBACK_GITHUB_APP_ID="${{ secrets.FEEDBACK_GITHUB_APP_ID }}" \
              -e FEEDBACK_GITHUB_APP_PRIVATE_KEY="${{ secrets.FEEDBACK_GITHUB_APP_PRIVATE_KEY }}" \
              -e AI_GATEWAY_URL="${{ secrets.AI_GATEWAY_URL || 'http://ai-gateway:8085' }}" \
              ${{ needs.build.outputs.image_ref }}

            # Второй контейнер (порт 3002)
            docker run -d \
              --restart always \
              --name typst-gost-2 \
              --network typst-net \
              --add-host=host.docker.internal:host-gateway \
              -p 3002:3000 \
              -e FEEDBACK_GITHUB_APP_ID="${{ secrets.FEEDBACK_GITHUB_APP_ID }}" \
              -e FEEDBACK_GITHUB_APP_PRIVATE_KEY="${{ secrets.FEEDBACK_GITHUB_APP_PRIVATE_KEY }}" \
              -e AI_GATEWAY_URL="${{ secrets.AI_GATEWAY_URL || 'http://ai-gateway:8085' }}" \
              ${{ needs.build.outputs.image_ref }}

            docker image prune -f